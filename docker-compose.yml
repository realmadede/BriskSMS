services:
  postgres:
    image: postgres:16-alpine
    container_name: brisksms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: brisksms
      POSTGRES_PASSWORD: brisksms_dev_secret
      POSTGRES_DB: brisksms_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brisksms -d brisksms_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brisksms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Product B: Private Dedicated Gateway Service (Mode B)
  smsgate-server:
    image: capcom6/android-sms-gateway-server:latest
    container_name: brisksms-smsgate
    restart: unless-stopped
    environment:
      - HTTP_PORT=8080
    ports:
      - "8080:8080"
    profiles: ["gateway", "full"]

volumes:
  postgres_data:
  redis_data:

