services:
  postgres:
    image: postgres:16-alpine
    container_name: brisksms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brisksms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brisksms_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-brisksms_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-brisksms} -d $${POSTGRES_DB:-brisksms_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: brisksms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: oven/bun:1.1-alpine
    container_name: brisksms-api
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-brisksms}:${POSTGRES_PASSWORD:-brisksms_dev_secret}@postgres:5432/${POSTGRES_DB:-brisksms_dev}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_jwt_access_secret_minimum_32_characters_long}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_minimum_32_characters_long}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "bun run packages/db/src/cli.ts migrate && bun run packages/db/src/cli.ts seed && bun run apps/api/src/main.ts"]
    profiles: ["app", "full"]

  worker:
    image: oven/bun:1.1-alpine
    container_name: brisksms-worker
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./:/app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-brisksms}:${POSTGRES_PASSWORD:-brisksms_dev_secret}@postgres:5432/${POSTGRES_DB:-brisksms_dev}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bun", "run", "apps/worker/src/main.ts"]
    profiles: ["app", "full"]

  # Product B: Private Dedicated Gateway Service (Mode B)
  smsgate-server:
    image: capcom6/android-sms-gateway-server:latest
    container_name: brisksms-smsgate
    restart: unless-stopped
    environment:
      - HTTP_PORT=8080
    ports:
      - "8080:8080"
    profiles: ["gateway", "full"]

volumes:
  postgres_data:
  redis_data:

