name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brisksms
          POSTGRES_PASSWORD: brisksms_dev_secret
          POSTGRES_DB: brisksms_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brisksms -d brisksms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://brisksms:brisksms_dev_secret@127.0.0.1:5433/brisksms_dev
      REDIS_URL: redis://127.0.0.1:6380
      FORCE_TCP_POSTGRES: 'true'
      FORCE_TCP_REDIS: 'true'
      ENCRYPTION_MASTER_KEY: brisksms_ci_encryption_master_key_32_bytes_min!

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: npm install

      - name: Typecheck Workspace
        run: npm run typecheck

      - name: Build Workspace Packages
        run: npm run build

      - name: Verify Service Connectivity
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 5433 && nc -z 127.0.0.1 6380; then
              echo "PostgreSQL (port 5433) and Redis (port 6380) are reachable."
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 1
          done
          echo "Services unreachable after 30 seconds"
          exit 1

      - name: Apply Database Migrations
        run: npm run db:migrate

      - name: Execute Automated Test Corpus
        run: npm test

  android-verify:
    name: Build & Verify Android Companion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set Android User Home
        run: |
          mkdir -p "${HOME}/.android"
          touch "${HOME}/.android/analytics.settings"

      - name: Verify Gradle Wrapper & Project Structure
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew projects --no-daemon

      - name: Run Android Unit Tests
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint
        working-directory: apps/android
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Assemble Debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brisksms-companion-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
