name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brisksms
          POSTGRES_PASSWORD: brisksms_dev_secret
          POSTGRES_DB: brisksms_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brisksms -d brisksms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://brisksms:brisksms_dev_secret@127.0.0.1:5433/brisksms_dev
      REDIS_URL: redis://127.0.0.1:6380
      FORCE_TCP_POSTGRES: 'true'
      FORCE_TCP_REDIS: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Workspace Dependencies
        run: npm install

      - name: Typecheck Workspace
        run: npm run typecheck

      - name: Build Workspace Packages
        run: npm run build

      - name: Verify Service Connectivity
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 5433 && nc -z 127.0.0.1 6380; then
              echo "PostgreSQL (port 5433) and Redis (port 6380) are reachable."
              exit 0
            fi
            echo "Waiting for services... ($i/30)"
            sleep 1
          done
          echo "Services unreachable after 30 seconds"
          exit 1

      - name: Apply Database Migrations
        run: npm run db:migrate

      - name: Execute Automated Test Corpus
        run: npm test
