name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brisksms
          POSTGRES_PASSWORD: brisksms_dev_secret
          POSTGRES_DB: brisksms_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brisksms -d brisksms_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://brisksms:brisksms_dev_secret@127.0.0.1:5433/brisksms_dev
      REDIS_URL: redis://127.0.0.1:6380
      FORCE_TCP_POSTGRES: 'true'
      FORCE_TCP_REDIS: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Generate Ephemeral CI Cryptographic Secrets
        run: |
          echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "CSRF_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install Workspace Dependencies (Frozen Lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck Workspace
        run: bun run typecheck

      - name: Build Workspace Packages
        run: bun run build

      - name: Verify Service Connectivity & Operational Readiness
        run: |
          echo "Probing PostgreSQL and Redis operational readiness..."
          pg_ready=0
          redis_ready=0
          for i in {1..30}; do
            if [ $pg_ready -eq 0 ]; then
              if pg_isready -h 127.0.0.1 -p 5433 -U brisksms -d brisksms_dev > /dev/null 2>&1; then
                echo "PostgreSQL (port 5433) is ready to accept queries."
                pg_ready=1
              fi
            fi
            if [ $redis_ready -eq 0 ]; then
              if (echo "PING" | nc -w 1 127.0.0.1 6380 | grep -q "PONG") || (command -v redis-cli > /dev/null && redis-cli -h 127.0.0.1 -p 6380 ping > /dev/null 2>&1); then
                echo "Redis (port 6380) is responding with PONG."
                redis_ready=1
              fi
            fi
            if [ $pg_ready -eq 1 ] && [ $redis_ready -eq 1 ]; then
              echo "Both PostgreSQL and Redis are verified operationally ready."
              break
            fi
            echo "Waiting for operational readiness... ($i/30)"
            sleep 1
          done
          if [ $pg_ready -ne 1 ] || [ $redis_ready -ne 1 ]; then
            echo "FATAL: Services failed operational readiness probe within 30 seconds."
            exit 1
          fi

      - name: Apply Database Migrations
        run: bun run db:migrate

      - name: Execute Automated Test Corpus
        run: bun run test

  android-verify:
    name: Build & Verify Android Companion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Verify Environment
        run: |
          echo "ANDROID_HOME: ${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT: ${ANDROID_SDK_ROOT}"
          yes | sdkmanager --licenses || true

      - name: Set Android User Home
        run: |
          mkdir -p "${HOME}/.android"
          touch "${HOME}/.android/analytics.settings"

      - name: Verify Gradle Wrapper & Project Structure
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew projects --no-daemon 2>&1 | tee projects.log || {
            status=$?
            echo "## Gradle Structure Verification Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 projects.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit $status
          }

      - name: Run Android Unit Tests
        working-directory: apps/android
        run: |
          set -e -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-tests.log || {
            status=$?
            echo "## Android Unit Tests Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 unit-tests.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 unit-tests.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          }

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brisksms-android-test-logs
          path: apps/android/unit-tests.log
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brisksms-companion-test-results
          path: apps/android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Run Android Lint
        working-directory: apps/android
        run: |
          set -e -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint.log || {
            status=$?
            echo "## Android Lint Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 lint.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 lint.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          }

      - name: Assemble Debug APK
        working-directory: apps/android
        run: |
          set -e -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble.log || {
            status=$?
            echo "## Android Assemble Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 assemble.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 40 assemble.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          }

      - name: Locate Debug APK
        if: always()
        working-directory: apps/android
        run: |
          echo "=== LOCATING GENERATED APKS ==="
          find . -name "*.apk" || true

      - name: Upload Assemble Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brisksms-android-assemble-log
          path: apps/android/assemble.log
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brisksms-companion-debug-apk
          path: apps/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
